buildImage = 'ghcr.io/railwayapp/nixpacks:latest'

[phases.setup]
nixPkgs = ['nodejs_latest']
nixpkgsArchive = '0ae2bc1419c3f345984c2629e72e7a631820fa4d'

[phases.install]
cmds = [
  'npm install --global corepack@0.35.0',
  'corepack enable',
  'corepack install --global pnpm@11.22.0',
  'pnpm install --frozen-lockfile',
]
